# /etc/nginx/conf.d/paylink-api.conf
# Nginx termina TLS y reenvía a Node, que solo escucha en 127.0.0.1:3000.
# Después de copiar este archivo ejecuta:  sudo certbot --nginx -d api.tu-dominio.hn
# (certbot añade el bloque 443 con el certificado y la redirección de HTTP a HTTPS).
#
# IMPORTANTE: no añadas cabeceras CORS aquí. Las pone Express; si las ponen los dos,
# el navegador recibe Access-Control-Allow-Origin duplicado y rechaza la respuesta.
server {
    listen 80;
    server_name api.tu-dominio.hn;

    # El token de Google Pay pesa pocos KB; Express ya limita el body a 16 KB.
    client_max_body_size 32k;

    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
